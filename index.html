        <!-- Blocking dark-mode script: runs before first paint to prevent white flash -->
        <script>
          (function () {
            try {
              var t = localStorage.getItem('theme');
              var dark =
                t === 'dark' ||
                (!t || t === 'system') &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches;
              if (dark) document.documentElement.classList.add('dark');
            } catch (e) {}
          })();
        </script>
        <title>DACC — De Anza ML and Agentic Cybersecurity Club</title>

        <!-- SEO Meta Tags -->
        <meta

        />
